# Runs from the retail-ims repo root when this folder is the GitHub repository root.
name: Integration Tests

on:
  # Pushes to main only: PR branches are covered by pull_request, so building
  # them on push as well ran every job twice per commit.
  push:
    branches: [main]
  pull_request:

# Least-privilege: this workflow only reads the repository.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR so pushes don't queue up.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-business-workflows:
    name: API business workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail_ims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail_ims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The suite connects as a non-superuser table owner, like production, so
      # FORCE ROW LEVEL SECURITY applies. The superuser `retail` bypasses RLS and
      # would let tenant-scoping bugs pass; it is only used to create this role.
      DATABASE_URL: postgresql://retail_app:retail_app@localhost:5432/retail_ims
      NODE_ENV: test
      JWT_SECRET: ci_jwt_secret_must_be_at_least_32_characters_long
      REFRESH_SECRET: ci_refresh_secret_must_be_at_least_32_chars
      COOKIE_SECRET: ci_cookie_secret_must_be_at_least_32_chars
      WEB_ORIGIN: http://127.0.0.1:5200
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      EXPORT_STORAGE_DIR: ./storage/exports
      MAIL_TRANSPORT: json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm ci (not npm install) ensures the lockfile is respected exactly.
      - run: npm ci

      - name: Create non-superuser database owner (RLS enforced)
        env:
          PGPASSWORD: retail
        run: |
          psql -h localhost -U retail -d retail_ims -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE retail_app LOGIN PASSWORD 'retail_app' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE retail_ims OWNER TO retail_app;
          ALTER SCHEMA public OWNER TO retail_app;
          SQL

      - name: Restore Prisma client cache
        id: prisma-cache
        uses: actions/cache@v6
        with:
          path: apps/api/node_modules/.prisma
          # Key includes lockfile (captures Prisma CLI version) and Node version
          # so a dependency bump or runtime upgrade forces regeneration.
          key: prisma-node22-${{ hashFiles('apps/api/prisma/schema.prisma', 'package-lock.json') }}

      - name: Generate Prisma client
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: npm run prisma:generate --workspace=api

      - name: Create required storage directories
        run: mkdir -p ./storage/exports ./storage/uploads
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npx prisma db seed --schema apps/api/prisma/schema.prisma
      # Fails if DATABASE_URL is ever pointed at a role that bypasses RLS again.
      - name: Check RLS is enforced for the test connection
        run: |
          visible=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM companies")
          if [ "$visible" != "0" ]; then
            echo "::error::DATABASE_URL sees $visible companies without a tenant context; RLS is not enforced"
            exit 1
          fi
      # All API e2e suites (workflows plus auth/CSRF, idempotency, PO listing,
      # OpenAPI). Running only the workflow specs let the others go stale.
      - run: npm run test:e2e --workspace=api -- --runInBand --forceExit
      # The same suites with TENANT_CONTEXT_MODE=strict (#239): a query made
      # outside any TenantContext gets no tenant and no system access, so every
      # request, guard, job and timer must set its own context. Test code itself
      # runs with explicit system access (apps/api/test/helpers/system-access.ts).
      - name: API e2e (strict tenant context)
        run: npm run test:e2e --workspace=api -- --runInBand --forceExit
        env:
          TENANT_CONTEXT_MODE: strict

  playwright-mobile:
    name: Playwright (Phase 8 mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail_ims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retail -d retail_ims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retail:retail@localhost:5432/retail_ims
      NODE_ENV: test
      JWT_SECRET: ci_jwt_secret_must_be_at_least_32_characters_long
      REFRESH_SECRET: ci_refresh_secret_must_be_at_least_32_chars
      COOKIE_SECRET: ci_cookie_secret_must_be_at_least_32_chars
      WEB_ORIGIN: http://127.0.0.1:5200
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      EXPORT_STORAGE_DIR: ./storage/exports
      MAIL_TRANSPORT: json
      CI: true
      PLAYWRIGHT_SKIP_WEBSERVER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm ci (not npm install) ensures the lockfile is respected exactly.
      - run: npm ci

      - name: Restore Prisma client cache
        id: prisma-cache
        uses: actions/cache@v6
        with:
          path: apps/api/node_modules/.prisma
          # Key includes lockfile (captures Prisma CLI version) and Node version
          # so a dependency bump or runtime upgrade forces regeneration.
          key: prisma-node22-${{ hashFiles('apps/api/prisma/schema.prisma', 'package-lock.json') }}

      - name: Generate Prisma client
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: npm run prisma:generate --workspace=api

      - name: Create required storage directories
        run: mkdir -p ./storage/exports ./storage/uploads
      - run: |
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          npx prisma db seed --schema apps/api/prisma/schema.prisma
      - run: npm run build
      - run: npx playwright install chromium --with-deps
        working-directory: apps/web
      - name: Start API and web preview
        run: |
          npm run start --workspace=api &
          npm run preview --workspace=web -- --host 127.0.0.1 --port 5200 &
      - name: Wait for API and web to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/v1/health > /dev/null &&
            curl -sf http://127.0.0.1:5200 > /dev/null && exit 0
            sleep 2
          done
          echo "❌ Services did not become ready within 120s"
          exit 1
      - run: npm run test:e2e --workspace=web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
